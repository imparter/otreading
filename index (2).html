<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<title>어! 성경 1년 1독</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f5;--card:#fff;--border:#d8e4d8;--text:#1a2e1a;--muted:#6a826a;--accent:#2d5a2d;--al:#e8f0e8;--ok:#2d6a4f;--r:14px;--sh:0 2px 12px rgba(30,60,30,.08);--read:#2d6a4f;--unread:#e0e0e0;--today:#e8f4e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;font-size:16px;-webkit-text-size-adjust:100%}
.hdr{background:var(--accent);color:#fff;padding:18px 20px 14px;text-align:center;position:sticky;top:0;z-index:100}
.hdr h1{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;letter-spacing:.03em}
.hdr .ds{font-size:12px;opacity:.8;margin-top:3px}

/* 상단 탭 */
.maintabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:99}
.mtab{flex:1;padding:11px 6px;font-size:13px;font-family:'Noto Sans KR',sans-serif;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.mtab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Day 선택기 */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daybtn.arrow{width:44px;height:44px;font-size:18px;border:1px solid var(--border);background:var(--card);color:var(--accent);cursor:pointer;border-radius:10px;flex-shrink:0;transition:all .15s}
.daybtn.arrow:active{background:var(--accent);color:#fff}
.day-selector{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.day-sel-label{font-size:13px;font-weight:600;color:var(--accent)}
.day-selector input{width:52px;font-size:18px;font-weight:700;font-family:'Noto Serif KR',serif;color:var(--accent);border:none;outline:none;text-align:center;background:transparent}
.day-sel-total{font-size:12px;color:var(--muted)}

.pg{display:none;padding:14px}
.pg.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.noday{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}

/* Day 배지 */
.day-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:8px;letter-spacing:.04em}
.today-tag{background:#fff;color:var(--accent);font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:2px}
.day-date{font-size:12px;color:var(--muted);margin-bottom:14px}

/* 본문 카드 */
.passage-card{background:var(--al);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.passage-title{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.passage-text{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;color:var(--text);line-height:1.5;white-space:pre-line}

/* 링크 버튼 */
.blinks{display:flex;gap:8px;margin-top:10px}
.bb{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 8px;border-radius:10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;font-weight:500;text-decoration:none;border:1px solid;transition:opacity .15s,transform .1s}
.bb:active{transform:scale(.97);opacity:.85}
.bb.k{background:#eef4fa;color:#1a4a6e;border-color:#b8d4ec}
.bb.v{background:#f0faf0;color:#2d6a2d;border-color:#b8d4b8}

/* 읽음 체크 버튼 */
.read-btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-family:'Noto Sans KR',sans-serif;font-weight:600;cursor:pointer;border:2px solid;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.read-btn.unread{background:#fff;color:var(--muted);border-color:var(--border)}
.read-btn.read{background:var(--read);color:#fff;border-color:var(--read)}
.read-btn:active{transform:scale(.98)}

/* 본문별 링크 행 */
.passage-links{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.passage-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.passage-ref{font-size:12px;font-weight:600;color:var(--accent);min-width:80px;white-space:nowrap}
.passage-btns{display:flex;gap:6px;flex:1}
.passage-btns .bb{flex:1;padding:7px 6px;font-size:11px}

/* ── 기록 탭 ── */
.stats-row{display:flex;gap:10px;margin-bottom:14px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stat-num{font-size:24px;font-weight:700;color:var(--accent);font-family:'Noto Serif KR',serif}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}

/* 진행 바 */
.prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.prog-label{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.prog-bar-bg{background:#e8e8e8;border-radius:20px;height:10px;overflow:hidden}
.prog-bar{background:var(--read);height:10px;border-radius:20px;transition:width .4s}

/* 연간 그리드 */
.grid-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.grid-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.grid-hint{font-size:11px;color:var(--muted);font-weight:400}
.day-grid{display:flex;flex-wrap:wrap;gap:4px}
.day-cell{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;cursor:pointer;transition:transform .1s;border:1px solid transparent;position:relative}
.day-cell:active{transform:scale(.9)}
.day-cell.done{background:var(--read);color:#fff}
.day-cell.undone{background:#e8e8e8;color:#aaa}
.day-cell.future{background:#f0f0f0;color:#ccc;cursor:default}
.day-cell.today-cell{border:2px solid var(--accent) !important;font-weight:700}
.day-cell.done.today-cell{background:var(--accent)}

/* 월별 섹션 */
.month-section{margin-bottom:16px}
.month-label{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* 범례 */
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.leg-dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>

<div class="hdr">
  <h1>📖 어! 성경 1년 1독</h1>
  <div class="ds" id="ds"></div>
</div>

<div class="maintabs">
  <button class="mtab on" onclick="showTab('read',this)">📖 말씀</button>
  <button class="mtab" onclick="showTab('hist',this)">📊 기록</button>
</div>

<!-- 말씀 탭 -->
<div class="pg on" id="pg-read">
  <div class="daynav">
    <button class="daybtn arrow" onclick="moveDay(-1)">◀</button>
    <div class="day-selector">
      <span class="day-sel-label">Day</span>
      <input type="number" id="dayInput" min="1" max="365" onchange="goToDay(this.value)" onclick="this.select()">
      <span class="day-sel-total">/ 365</span>
    </div>
    <button class="daybtn arrow" onclick="moveDay(1)">▶</button>
  </div>
  <div id="content"></div>
</div>

<!-- 기록 탭 -->
<div class="pg" id="pg-hist">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="s-done">0</div>
      <div class="stat-label">읽은 날</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-left">365</div>
      <div class="stat-label">남은 날</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-streak">0</div>
      <div class="stat-label">연속 일수</div>
    </div>
  </div>
  <div class="prog-wrap">
    <div class="prog-label"><span>진행률</span><span id="prog-pct">0%</span></div>
    <div class="prog-bar-bg"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
  </div>
  <div class="grid-wrap">
    <div class="grid-title">1년 읽기 현황 <span class="grid-hint">탭하면 토글</span></div>
    <div class="legend">
      <span><span class="leg-dot" style="background:var(--read)"></span>읽음</span>
      <span><span class="leg-dot" style="background:#e8e8e8"></span>안읽음</span>
      <span><span class="leg-dot" style="background:#f0f0f0"></span>미래</span>
    </div>
    <div style="margin-top:12px" id="daygrid"></div>
  </div>
</div>

const PLAN={...OT,...NT};
const TOTAL=365;
const WD=['일','월','화','수','목','금','토'];

function getDayOfYear(d){
  const s=new Date(d.getFullYear(),0,1);
  const dOnly=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.round((dOnly-s)/86400000)+1;
}
function formatDate(d){
  return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]}요일)`;
}
function todayDayNum(){return getDayOfYear(new Date());}

// localStorage 키: 'ot-read-YYYY-DDD' (기존 읽음 기록 유지를 위해 키 이름은 그대로 둠)
function readKey(dayNum){
  return`ot-read-${new Date().getFullYear()}-${dayNum}`;
}
function isRead(dayNum){
  return localStorage.getItem(readKey(dayNum))==='1';
}
function toggleRead(dayNum){
  if(isRead(dayNum)) localStorage.removeItem(readKey(dayNum));
  else localStorage.setItem(readKey(dayNum),'1');
}

// ── 성경 책 이름 → YouVersion 코드 ──
const BOOK_MAP = {
  // 구약
  '창':'GEN','출':'EXO','레':'LEV','민':'NUM','신':'DEU',
  '수':'JOS','삿':'JDG','룻':'RUT','삼상':'1SA','삼하':'2SA',
  '왕상':'1KI','왕하':'2KI','대상':'1CH','대하':'2CH',
  '라':'EZR','느':'NEH','더':'EST','욥':'JOB','시':'PSA',
  '잠':'PRO','전':'ECC','아':'SNG','사':'ISA','렘':'JER',
  '애':'LAM','겔':'EZK','단':'DAN','호':'HOS','욜':'JOL',
  '암':'AMO','옵':'OBA','욘':'JON','미':'MIC','나':'NAM',
  '합':'HAB','습':'ZEP','학':'HAG','슥':'ZEC','말':'MAL',
  // 신약
  '마':'MAT','막':'MRK','눅':'LUK','요':'JHN','행':'ACT',
  '롬':'ROM','고전':'1CO','고후':'2CO','갈':'GAL','엡':'EPH',
  '빌':'PHP','골':'COL','살전':'1TH','살후':'2TH','딤전':'1TI',
  '딤후':'2TI','딛':'TIT','몬':'PHM','히':'HEB','약':'JAS',
  '벧전':'1PE','벧후':'2PE','요일':'1JN','요이':'2JN','요삼':'3JN',
  '유':'JUD','계':'REV',
};

// 한 줄에 여러 책이 섞여 있어도 각각 링크를 만듦
// 예) "눅 1:1-38, 마 1:18-25, 눅 1:39-80" → 눅 1장, 마 1장
//     "시 1-2, 4-6, 8-10편" → 시 1, 4, 8편 (책 이름 없는 숫자는 앞 책을 이어받음)
// 범위는 시작 장만 사용 (기존 방식 유지)
const BOOK_RE=(()=>{
  const names=Object.keys(BOOK_MAP).sort((a,b)=>b.length-a.length).join('|');
  return new RegExp(`(?:(${names})\\s*)?(\\d+)(?::\\d+[ab]?)?(?:\\s*-\\s*\\d+[ab]?(?::\\d+[ab]?)?)?`,'g');
})();

function parseBooks(passage){
  const results=[];
  const text=passage.replace(/[()]/g,' ');
  let cur=null, m;
  BOOK_RE.lastIndex=0;
  while((m=BOOK_RE.exec(text))!==null){
    if(m[1]){
      // 책 이름 앞에 다른 한글이 붙어 있으면 무시
      const before=text[m.index-1];
      if(before && /[가-힣]/.test(before)) continue;
      cur=m[1];
    }
    if(!cur) continue;
    const ch=m[2];
    if(!results.find(r=>r.ko===cur&&r.ch===ch)){
      const unit=cur==='시'?'편':'장';
      results.push({ko:cur, label:`${cur} ${ch}${unit}`, yvCode:BOOK_MAP[cur], ch});
    }
  }
  return results;
}

function makeLinks(books){
  return books.map(b=>`
    <div class="passage-row">
      <span class="passage-ref">${b.label}</span>
      <div class="passage-btns">
        <a class="bb v" href="https://www.bible.com/ko/bible/88/${b.yvCode}.${b.ch}.KRV" target="_blank">📖 YouVersion</a>
      </div>
    </div>`).join('');
}

// ── 말씀 탭 ──
let currentDay=1;

function moveDay(d){
  goToDay(Math.min(TOTAL,Math.max(1,currentDay+d)));
}

function goToDay(n){
  n=parseInt(n);
  if(isNaN(n)||n<1) n=1;
  if(n>TOTAL) n=TOTAL;
  currentDay=n;
  document.getElementById('dayInput').value=n;
  localStorage.setItem('ot-lastday',n);
  renderDay(n);
}

function renderDay(dayNum){
  document.getElementById('ds').textContent=formatDate(new Date());
  const content=document.getElementById('content');

  if(!PLAN[dayNum]){
    content.innerHTML=`<div class="noday">📅<br><br>Day ${dayNum}<br>일독 범위(1~${TOTAL}일)를 벗어났습니다</div>`;
    return;
  }

  const [vol,passage]=PLAN[dayNum];
  const read=isRead(dayNum);
  const linksHtml=makeLinks(parseBooks(passage));
  const isToday=dayNum===todayDayNum();
  const todayTag=isToday?` <span class="today-tag">오늘</span>`:'';
  const testament=dayNum<=273?'구약':'신약';

  content.innerHTML=`
    <div class="card">
      <div class="day-badge">📅 Day ${dayNum} &nbsp;·&nbsp; ${testament} ${vol}${todayTag}</div>
      <div class="passage-card">
        <div class="passage-title">📖 말씀</div>
        <div class="passage-text">${passage}</div>
        <div class="passage-links">${linksHtml}</div>
      </div>
      <button class="read-btn ${read?'read':'unread'}" id="readbtn" onclick="handleReadToggle(${dayNum})">
        ${read?'✅ 읽었어요':'○ 읽음 체크'}
      </button>
    </div>`;
}

function handleReadToggle(dayNum){
  toggleRead(dayNum);
  const read=isRead(dayNum);
  const btn=document.getElementById('readbtn');
  btn.className=`read-btn ${read?'read':'unread'}`;
  btn.innerHTML=read?'✅ 읽었어요':'○ 읽음 체크';
  if(document.getElementById('pg-hist').classList.contains('on')) renderHist();
}

// ── 기록 탭 ──
function renderHist(){
  const today=todayDayNum();
  let done=0, streak=0;

  for(let i=1;i<=TOTAL;i++){
    if(isRead(i)) done++;
  }
  for(let i=Math.min(today,TOTAL);i>=1;i--){
    if(isRead(i)) streak++;
    else break;
  }

  const left=Math.max(0,TOTAL-done);
  const pct=Math.round(done/TOTAL*100);

  document.getElementById('s-done').textContent=done;
  document.getElementById('s-left').textContent=left;
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-bar').style.width=pct+'%';

  const grid=document.getElementById('daygrid');
  grid.innerHTML='';

  const year=new Date().getFullYear();
  let currentMonth=-1;
  let monthGrid=null;

  for(let day=1;day<=TOTAL;day++){
    const date=new Date(year,0,day);
    const month=date.getMonth();

    if(month!==currentMonth){
      currentMonth=month;
      const sec=document.createElement('div');
      sec.className='month-section';
      const lbl=document.createElement('div');
      lbl.className='month-label';
      lbl.textContent=`${month+1}월`;
      sec.appendChild(lbl);
      monthGrid=document.createElement('div');
      monthGrid.className='day-grid';
      sec.appendChild(monthGrid);
      grid.appendChild(sec);
    }

    const cell=document.createElement('div');
    const read=isRead(day);
    const isFuture=day>today;
    const isToday=day===today;

    cell.className='day-cell '+(isFuture?'future':read?'done':'undone')+(isToday?' today-cell':'');
    cell.textContent=day;
    cell.title=`Day ${day}: ${PLAN[day]?PLAN[day][1]:''}`;

    if(!isFuture){
      cell.onclick=()=>{
        toggleRead(day);
        renderHist();
      };
    }
    monthGrid.appendChild(cell);
  }
}

// ── 탭 전환 ──
function showTab(tab,btn){
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.mtab').forEach(e=>e.classList.remove('on'));
  document.getElementById('pg-'+tab).classList.add('on');
  btn.classList.add('on');
  if(tab==='hist') renderHist();
}

// 초기 렌더
document.getElementById('ds').textContent=formatDate(new Date());
goToDay(todayDayNum());
